<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<base href="/game/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="למה הסנדוויץ' חזר הביתה?">
<meta property="og:description" content="16 כריכים. 10 שניות לכל אחד. גלי מה חסר בשיווק שלך.">
<title>משחק הסנדוויצ'ים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;700;800;900&display=swap">
<style>
/* Layout: one phone-width column; each screen is a stack of brand blocks — black brush headline, photo, answers. Single brand look (light paper), colors set explicitly. */
:root{
  --ink:#262628; --red:#EE2C3B; --paper:#F2F3F5; --white:#FFFFFF;
  --mute:#68686F; --line:#D8D9DE; --red-soft:#FDE8EA;
  --font:'Rubik', 'Segoe UI', Arial, sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--font);direction:rtl;font-size:17px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
.app{max-width:500px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}

/* brand pieces */
.brush{position:relative;display:block;color:var(--white);isolation:isolate}
.brush svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.brush svg path{fill:var(--ink)}
.brush.white{color:var(--ink)} .brush.white svg path{fill:var(--white)}
.red{color:var(--red)}
.ruled{border-block:2px solid var(--red);padding-block:8px;text-align:center;font-weight:500}
.logo{display:block;width:170px;margin-inline:auto}
.preview-note{font-size:13px;color:var(--mute);text-align:center}

/* entry */
.game-logo{display:block;width:170px;margin-inline:auto}
.game-logo.small{width:84px}
.res-head{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.res-head .game-logo{margin-bottom:6px}
.res-for{font-size:16px;color:var(--mute)}
.res-title{font-size:clamp(34px,10vw,44px);font-weight:900;line-height:1.05;display:flex;flex-direction:column;align-items:center;gap:10px}
.res-title::after{content:"";width:56px;height:5px;border-radius:3px;background:var(--red)}
.res-head .score{margin-top:4px}
.res-line{font-size:17px;max-width:34ch}
.hero{font-size:clamp(34px,10vw,48px);font-weight:900;line-height:1.08;text-align:center}
.sign{display:flex;align-items:center;justify-content:center;gap:10px;font-size:13px;color:var(--mute);padding-top:8px}
.sign img{width:96px}
.lede{text-align:center;font-size:18px}
.lede b{font-weight:700}
form{display:flex;flex-direction:column;gap:14px}
label.field{display:flex;flex-direction:column;gap:4px;font-weight:500;font-size:15px}
.field input{border:2px solid var(--ink);background:var(--white);border-radius:4px;padding:12px 14px;font-size:18px;color:var(--ink)}
.field input:invalid:not(:placeholder-shown){border-color:var(--red)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mute)}
.consent input{width:20px;height:20px;accent-color:var(--red);margin-top:2px;flex:none}
.err{color:var(--red);font-size:14px;min-height:1.2em}

.btn{border:0;border-radius:4px;padding:16px 20px;font-weight:800;font-size:19px;background:var(--red);color:var(--white);text-align:center;text-decoration:none;display:block;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ink{background:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--ink)}

/* game */
.topbar{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-variant-numeric:tabular-nums}
.box{display:grid;grid-template-columns:repeat(16,1fr);gap:3px}
.box i{height:8px;border-radius:2px;background:var(--line)}
.box i.ok{background:var(--red)} .box i.no{background:var(--ink)} .box i.now{background:var(--mute)}
.photo{position:relative;aspect-ratio:1;max-width:100%;border:6px solid var(--white);box-shadow:0 10px 30px rgba(38,38,40,.18);background:var(--line);overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.timer span{display:block;height:100%;background:var(--red);transform-origin:right;transform:scaleX(1)}
.timer.low span{background:var(--ink)}
.q{font-size:24px;font-weight:800}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{border:2px solid var(--ink);background:var(--white);color:var(--ink);text-align:right;padding:14px 16px;border-radius:4px;font-size:17px;font-weight:500}
.opt:hover:not(:disabled){background:var(--paper)}
.opt.right{background:var(--white);color:var(--ink);border:3px solid var(--ink);font-weight:800;position:relative;padding-inline-start:46px;opacity:1}
.opt.right::before{content:"";position:absolute;inset-inline-start:18px;top:50%;width:9px;height:17px;border-right:4px solid var(--red);border-bottom:4px solid var(--red);transform:translateY(-62%) rotate(45deg)}
.opts.done .opt:not(.right):not(.wrong){opacity:.45}
.opt.wrong{border-color:var(--red);color:var(--red);text-decoration:line-through}
.opt:disabled{cursor:default}
.feedback{display:flex;flex-direction:column;gap:12px;padding:18px;background:var(--white);border-top:4px solid var(--red)}
.verdict{font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--red)}
.lesson{font-size:28px;font-weight:900;line-height:1.1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.lesson::after{content:"";width:46px;height:5px;border-radius:3px;background:var(--red)}
.cheer{font-weight:700}

/* result */
.res-name{padding:30px 30px 62px;text-align:center}
.res-name small{display:block;font-size:16px;font-weight:400;opacity:.85}
.res-name strong{display:block;font-size:clamp(28px,8vw,38px);font-weight:900;line-height:1.1}
.score{font-size:18px;text-align:center}
.score b{font-size:28px;font-weight:900;font-variant-numeric:tabular-nums}
.meters{display:flex;flex-direction:column;gap:10px;background:var(--white);padding:16px}
.meter{display:grid;grid-template-columns:76px 1fr auto;gap:12px;align-items:center}
.meter .lab{font-weight:700}
.dots{display:flex;gap:6px}
.dots i{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink)}
.dots i.on{background:var(--red);border-color:var(--red)}
.tag{font-size:12px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.weak{background:var(--red);color:var(--white)} .tag.strong{background:var(--ink);color:var(--white)}
.tip{display:flex;flex-direction:column;gap:8px}
.tip h3{font-size:15px;font-weight:700;color:var(--red)}
.tip p{font-size:18px}
.actions{display:flex;flex-direction:column;gap:12px}
.card{background:var(--white);padding:16px;display:flex;flex-direction:column;gap:10px}
.card h3{font-size:17px;font-weight:800}
.contact{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.contact span{font-weight:700;font-variant-numeric:tabular-nums}
.mini{border:2px solid var(--ink);background:transparent;border-radius:4px;padding:8px 14px;font-weight:700}
form.row{display:flex;flex-direction:row;gap:8px}
.row input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:4px;padding:10px 12px;font-size:16px}
.again{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:15px;align-self:center}
.wa-note{text-align:center;font-size:18px;padding:14px 16px;background:var(--white);border-block:2px solid var(--red)}
.dare{display:flex;flex-direction:column;gap:16px;padding-top:8px}
.dare-title{font-size:26px;font-weight:900;text-align:center}
.dare-sub{text-align:center;margin-top:-8px}
.pc-ask{font-size:16px;font-weight:500;margin-top:-6px}
.pc-credit{position:absolute;left:20px;top:50%;transform:translate(-50%,-50%) rotate(-90deg);display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;color:var(--mute)}
.pc-credit img{width:62px;display:block}
.postcard{position:relative;margin:0 auto;width:min(100%,360px);background:var(--white);padding:22px 40px 22px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transform:rotate(-1.5deg);box-shadow:0 12px 28px rgba(38,38,40,.18);border:1px solid var(--line)}
.stamp{position:absolute;top:14px;left:14px;width:18px;height:18px;border-radius:50%;background:var(--red)}
.pc-eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--mute)}
.pc-game{width:92px}
.pc-score{display:flex;flex-direction:column;align-items:center;gap:2px;margin-block:4px}
.pc-score span{font-size:22px;font-weight:800;line-height:1.2}
.pc-score b{font-size:54px;line-height:1;font-weight:900;color:var(--red);font-variant-numeric:tabular-nums}
.pc-line{font-size:16px;font-weight:500;line-height:1.4;text-wrap:balance}
.pc-dare{font-size:30px;font-weight:900;line-height:1.1}
.pc-logo{width:96px}
@media (prefers-reduced-motion: reduce){.btn,.timer span{transition:none}}
</style>

</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<script>
const BRUSH = "M785.41,339.04c-.89-3.74-.58-8-.48-12.01.23-8.81-2.46-16.71-5.08-24.51-2.24-6.69-5.98-8.1-12.17-5.94-5.89-1.31-6.28-1.66-6.38-6.53-.05-2.25.31-4.54.13-6.76-.58-6.92,2.19-13.28,2.12-20.04-.14-14.86-.11-29.76-2.44-44.44-1.14-7.18-4.14-12.1-10.05-14.48-10-4.04-10.96-5.87-11.53-19.03-.18-4.05.09-8.12.02-12.18-.06-3.61.17-7.35-.54-10.78-2.33-11.31-6.39-14.9-13.46-14.08-2.53.29-5.1-.06-7.65-.07-70.04,0-139.97.69-210,3.37-26.6,1.02-53.2,2.22-79.79,3.6-22.57,1.17-46.7-1.54-68.77,3.41-1.77.4-3.62.27-5.43.27-8.37,0-16.75.12-25.12-.07-10.93-.24-21.65,2.81-32.64,2.32-12.36-.55-24.77.1-37.15.46-3.56.1-7.35-.73-10.58,2.17,1.81.12,3.29.79,4.51,1.92-1.22-1.13-2.7-1.8-4.51-1.92-3.62.26-7.26.28-10.84.85-2.15.34-4.16.97-6.42.51-10.12-2.07-20.27-1.28-30.4.14-8.99,1.27-17.95,2.99-26.96,3.89-10.13,1.02-20.36.02-30.4,2.85-2.08.59-4.36.4-6.52.19-7.23-.68-14.54.34-21.71-1.97-4.41-1.42-8.37,4.03-7.55,9.88,1.36,9.75,2.07,19.59,4.66,29.08,1.97,7.23,3.49,14.73,2.96,22.55-11.96,1.1-23.93,2.18-35.89,3.33-1.07.1-2.14.5-3.17.92-3.05,1.26-4.94,3.76-5.04,7.88-.17,7.65-.59,15.41,2.94,22.27,1.42,2.75,1.78,5.84,2.54,8.84,1.85,7.3,4.02,14.47,5.99,21.73.78,2.87,2.36,4.49,4.66,5.01,1.42.32,2.9.3,4.35.4,15.3.99,13.16,5.24,16.05,16.81,1.6,6.4.65,7.86-5.33,7.54-8.41-.45-16.66.09-24.86,2.64-5.23,1.63-6.13,2.48-6.28,8.65-.14,5.85,3.93,28.4,6.83,37.83.78,7.16,4.89,7.97,9.62,7.98,37.71,0,73.93.44,111.57-3.14,82.9-7.87,165.89-14.96,249.02-17.79,80.59-2.74,160.6,1.95,241.06,5.35,7.98.34,16.02,1.21,23.87,2.97,7.24,1.62,14.43,2.13,21.71,1.98,1.33,1.61,2.99,2.15,4.78,2.18,4.97.08,9.94.14,14.9.21,1.46.15,2.92.3,4.38.45,2.56,2.47,5.29,4.7,7.63,7.46,4.53,5.35,12.21,3.75,15.86-3.51,1.55-3.08,2.5-6.41,2.7-10.09.55-10.18,2.72-20.25.26-30.57Z";
const BUSINESS_PHONE = '972546494732';
const SHEET_URL = 'https://script.google.com/macros/s/AKfycbzZmspM0bM1NcnLO7O_gJ_AKLFx2cz98wRpt0p2Zk5SQ1xpSzpGvhm8L7OZPHmt4953/exec';
const GAME_URL = location.origin + location.pathname;
const PARAMS = new URLSearchParams(location.search);
const newId = () => Date.now().toString(36).slice(-4) + Math.random().toString(36).slice(2, 6);
// sends one event to the Google Sheet; failures never interrupt the game
function track(event, data){
  try{ fetch(SHEET_URL, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({id:S.id, event, ...data})}).catch(()=>{}); }catch(e){}
}
const brush = () => `<svg viewBox="25 150 770 300" preserveAspectRatio="none" aria-hidden="true"><path d="${BRUSH}"/></svg>`;

const NAMES = {relevance:'התאמה', promise:'הבטחה', presence:'נוכחות', attraction:'משיכה'};
const ORDER = ['relevance','promise','presence','attraction'];
const PROFILES = {
  presence:  {title:'הכריך הנעלם', line:'יש לך מה להציע, אבל הקהל לא פוגש אותך ברגע שהוא צריך לבחור.', tip:'כתבי 3 רגעים שבהם הלקוחה שלך צריכה אותך. עכשיו בדקי: איפה היא נמצאת באותם רגעים? שם הכריך שלך צריך להיות.'},
  attraction:{title:'הכריך של כולם', line:'השירות שלך טוב, אבל הוא נראה כמו כל השאר ולא מעורר חשק.', tip:'קחי את הפוסט האחרון שלך ושאלי: למה שמישהי תעצור עליו באמצע הגלילה? אם אין תשובה, זה המקום להתחיל.'},
  promise:   {title:'כריך הפלא', line:'יש בו הכול, ובגלל זה לא ברור מה בדיוק מקבלים.', tip:'נסחי במשפט אחד מה הלקוחה מקבלת ממך. בלי "וגם". אם לא מצליח במשפט אחד, ההבטחה עוד לא חדה.'},
  relevance: {title:'הכריך של מישהו אחר', line:'ההצעה טובה, אבל היא לא מדברת אל האדם הנכון ואל מה שהוא צריך עכשיו.', tip:'כתבי משפט אחד: למי בדיוק השירות שלך, ובאיזה רגע בחיים שלה היא צריכה אותו. כל השאר נבנה מזה.'}
};
const CHEERS = {6:'שליש מהתיק כבר מאחורייך. ממשיכות.', 11:'עוד חמישה כריכים, ויש לך תמונה מלאה.'};
const SECONDS = 10;

let slides = [];
let S = {screen:'entry', name:'', phone:'', consent:false, i:0, answers:[]};
const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const store = (k,v) => { try{ v===undefined ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };

// ---------- entry ----------
function renderEntry(){
  app.innerHTML = `
    <img class="game-logo" src="game-logo.png" alt="אמא מוכרת סנדוויצ'ים">
    <h1 class="hero">למה הסנדוויץ'<br>חזר הביתה<span class="red">?</span></h1>
    <p class="lede"><b>16 כריכים. 10 שניות לכל אחד.</b><br>בסוף תגלי מה חסר בשיווק שלך.</p>
    <form id="f" novalidate>
      <label class="field">שם פרטי<input id="name" autocomplete="given-name" required placeholder=" " value="${esc(S.name)}"></label>
      <label class="field">טלפון נייד<input id="phone" type="tel" inputmode="tel" autocomplete="tel" required placeholder=" " value="${esc(S.phone)}"></label>
      <label class="consent"><input id="consent" type="checkbox" ${S.consent?'checked':''}>מאשרת לקבל משוננA תוכן, טיפים והצעות בוואטסאפ. אפשר להסיר בכל רגע.</label>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" type="submit">יאלה, משחקים</button>
    </form>
    <footer class="sign"><span>משחק מבית</span><img src="logo.png" alt="שוננA"></footer>
    <p class="preview-note">הפרטים נשמרים אצל שוננA בלבד.</p>`;
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.replace(/[\s-]/g,'');
    const err = document.getElementById('err');
    if(!name){ err.textContent = 'איך לקרוא לך? כתבי שם פרטי.'; return; }
    if(!/^0?5\d{8}$/.test(phone)){ err.textContent = 'מספר הטלפון צריך להיות נייד ישראלי, למשל 050-1234567.'; return; }
    Object.assign(S, {id:newId(), name, phone, consent:document.getElementById('consent').checked, screen:'play', i:0, answers:[], finished:false});
    track('signup', {name, phone, consent:S.consent, src:PARAMS.get('src') || (PARAMS.get('ref') ? 'חברה' : 'ישיר'), ref:PARAMS.get('ref') || ''});
    store('sandwich-player', {name, phone});
    render();
  });
}

// ---------- play ----------
let timerRAF = 0;
function boxStrip(){
  return `<div class="box" aria-hidden="true">${slides.map((_,k)=>{
    const a = S.answers[k]; return `<i class="${a ? (a.ok?'ok':'no') : (k===S.i?'now':'')}"></i>`;}).join('')}</div>`;
}
function renderPlay(){
  const s = slides[S.i];
  app.innerHTML = `
    <div class="topbar"><span>כריך ${S.i+1}/16</span><span>${S.answers.filter(a=>a.ok).length} נכונות</span></div>
    ${boxStrip()}
    <div class="photo"><img id="ph" src="${s.img}" alt="כריך שחזר הביתה, שלב ${S.i+1}"></div>
    <div class="timer" id="tm" role="progressbar" aria-label="זמן שנותר"><span></span></div>
    <h2 class="q">${esc(s.question)}</h2>
    <div class="opts">${s.options.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join('')}</div>
    <div id="fb"></div>`;
  app.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => answer(+b.dataset.k)));
  const img = document.getElementById('ph');
  const go = () => startTimer();
  img.complete ? go() : (img.onload = img.onerror = go);
  const next = slides[S.i+1]; if(next){ const p = new Image(); p.src = next.img; }
  window.scrollTo({top:0});
}
function startTimer(){
  cancelAnimationFrame(timerRAF);
  const bar = document.querySelector('#tm span'), wrap = document.getElementById('tm');
  const t0 = performance.now();
  const tick = now => {
    const left = Math.max(0, 1 - (now - t0) / (SECONDS*1000));
    if(!bar.isConnected) return;
    bar.style.transform = `scaleX(${left})`;
    wrap.classList.toggle('low', left < .3);
    if(left <= 0) return answer(-1);
    timerRAF = requestAnimationFrame(tick);
  };
  timerRAF = requestAnimationFrame(tick);
}
function answer(k){
  if(S.answers[S.i]) return;
  cancelAnimationFrame(timerRAF);
  const s = slides[S.i], ok = k === s.correct;
  S.answers[S.i] = {k, ok, ing:s.ingredient};
  app.querySelector('.opts').classList.add('done');
  app.querySelectorAll('.opt').forEach((b,j) => {
    b.disabled = true;
    if(j===s.correct) b.classList.add('right');
    else if(j===k) b.classList.add('wrong');
  });
  const last = S.i === slides.length-1, n = S.i+1;
  if(!last) track('progress', {reached:n});
  document.getElementById('fb').innerHTML = `
    <div class="feedback">
      <p class="verdict">${k<0 ? 'נגמר הזמן!' : ok ? 'נכון!' : 'לא בדיוק...'}</p>
      <p class="lesson">${esc(s.lesson_title)}</p>
      <p>${esc(s.lesson_text)}</p>
      ${CHEERS[n] ? `<p class="cheer">${CHEERS[n]}</p>` : ''}
      <button class="btn ink" id="next">${last ? 'לתוצאות' : 'לכריך הבא'}</button>
    </div>`;
  app.querySelector('.box').outerHTML = boxStrip();
  const nb = document.getElementById('next');
  nb.addEventListener('click', () => { if(last){ S.screen='result'; } else { S.i++; } render(); }, {once:true});
  nb.scrollIntoView({behavior:'smooth', block:'center'});
}

// ---------- result ----------
function tally(){
  const t = Object.fromEntries(ORDER.map(k=>[k,0]));
  S.answers.forEach(a => { if(a.ok) t[a.ing]++; });
  const weak = ORDER.reduce((m,k)=> t[k] < t[m] ? k : m, ORDER[0]);
  const strong = ORDER.reduce((m,k)=> t[k] > t[m] ? k : m, ORDER[0]);
  return {t, weak, strong, total: S.answers.filter(a=>a.ok).length};
}
function shareText(total){
  return `שיחקתי עכשיו במשחק שיווקי מדליק והצלחתי ${total}/16. רוצה לנסות לעקוף אותי? נראה אותך 🥪
${GAME_URL}?ref=${encodeURIComponent(S.id || '')}`;
}
function renderResult(){
  const {t, weak, strong, total} = tally(), P = PROFILES[weak];
  if(!S.finished){ S.finished = true; track('finish', {total, t, profile:P.title}); }
  app.innerHTML = `
    <header class="res-head">
      <img class="game-logo small" src="game-logo.png" alt="אמא מוכרת סנדוויצ'ים">
      <p class="res-for">${esc(S.name)}, יצא לך:</p>
      <h1 class="res-title">${P.title}</h1>
      <p class="score">ענית נכון על <b>${total}</b> מתוך 16 כריכים</p>
      <p class="res-line">${P.line}</p>
    </header>
    <div class="meters" aria-label="ציון לפי עיקרון">
      ${ORDER.map(k=>`<div class="meter"><span class="lab">${NAMES[k]}</span>
        <span class="dots" aria-label="${t[k]} מתוך 4">${[0,1,2,3].map(d=>`<i class="${d<t[k]?'on':''}"></i>`).join('')}</span>
        ${k===weak?'<span class="tag weak">כדאי לחזק</span>':k===strong?'<span class="tag strong">הכי חזק</span>':'<span></span>'}</div>`).join('')}
    </div>
    <div class="tip"><h3>המשימה שלך להיום</h3><p>${P.tip}</p></div>
    <p class="wa-note">הסיכום המלא ומדריך קצר כבר בדרך אלייך <b>לוואטסאפ</b><span class="red">.</span></p>
    <section class="dare" aria-label="אתגרי חברה">
      <h2 class="dare-title">עם מי את רוצה להתחרות<span class="red">?</span></h2>
      <p class="dare-sub">שלחי את הגלויה לחברה, ונראה אם היא מצליחה לעקוף אותך.</p>
      <figure class="postcard" aria-label="גלויה לשיתוף">
        <span class="stamp" aria-hidden="true"></span>
        <img class="pc-game" src="game-logo.png" alt="">
        <p class="pc-line">שיחקתי עכשיו במשחק שיווקי מדליק</p>
        <p class="pc-ask">רוצה לנסות לעקוף אותי?</p>
        <p class="pc-score"><span>הצלחתי:</span><b>${total}/16</b></p>
        <p class="pc-dare">נראה אותך<span class="red">.</span></p>
        <footer class="pc-credit"><span>משחק מבית</span><img src="logo.png" alt="שוננA"></footer>
      </figure>
      <a class="btn" id="share" href="https://wa.me/?text=${encodeURIComponent(shareText(total))}" target="_blank" rel="noopener">שלחי לחברה בוואטסאפ</a>
    </section>
    <button class="again" id="again">לשחק שוב</button>
    <footer class="sign"><span>משחק מבית</span><img src="logo.png" alt="שוננA"></footer>`;
  document.getElementById('share').addEventListener('click', () => track('share', {}));
  document.getElementById('again').addEventListener('click', () => { Object.assign(S,{screen:'play',i:0,answers:[],finished:false}); render(); });
  window.scrollTo({top:0});
}

function render(){ ({entry:renderEntry, play:renderPlay, result:renderResult})[S.screen](); }

async function start(saved){
  try{ slides = await (await fetch('slides.json')).json(); }
  catch(e){ app.innerHTML = '<p class="lede">המשחק לא נטען. רענני את הדף ונסי שוב.</p>'; return; }
  if(saved && saved.screen) S = saved;
  else { try{ const p = JSON.parse(localStorage.getItem('sandwich-player')||'null'); if(p){ S.name=p.name; S.phone=p.phone; } }catch(e){} }
  render();
}
window.claude?.hot?.snapshot?.(() => S);
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data);
</script>
